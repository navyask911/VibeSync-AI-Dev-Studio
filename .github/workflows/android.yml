name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and build Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35 and 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "system-images;android-36;google_apis;x86_64" \
            "platform-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Audit offline tools and telemetry dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq 'firebase-analytics|firebase-crashlytics|sentry-android|mixpanel|amplitude|segment-analytics|appsflyer|adjust-android|datadog-android|newrelic' app/build.gradle.kts; then
            echo "::error::A third-party analytics or diagnostic SDK was added to app dependencies."
            exit 1
          fi
          if grep -Eiq 'HttpURLConnection|OkHttpClient|HttpClient|openConnection|java[.]net[.]URL[[:space:]]*[(]' app/src/main/java/com/vibesync/promptstudio/domain/usecase/DeveloperToolboxTools.kt; then
            echo "::error::The offline developer toolbox must not make network requests."
            exit 1
          fi
          echo "Offline developer utilities and no-app-telemetry dependency audit passed."

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug

      - name: Run Android Keystore instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 1200
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            device="emulator-5554"

            # sys.boot_completed can be true before Android's package manager is registered.
            # The previous failure reached connectedDebugAndroidTest with the package service
            # missing, so check the actual service before asking Gradle to install APKs.
            wait_for_package_manager() {
              local max_attempts="$1"
              for attempt in $(seq 1 "$max_attempts"); do
                local boot_status package_status
                boot_status="$(adb -s "$device" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                package_status="$(adb -s "$device" shell service check package 2>&1 || true)"
                if [[ "$boot_status" == "1" && "$package_status" == *"found"* ]]; then
                  echo "Android boot and package manager are ready."
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            if ! wait_for_package_manager 60; then
              echo "::warning::Emulator boot completed without a usable package manager; rebooting once."
              adb -s "$device" reboot || true
              adb -s "$device" wait-for-device
              if ! wait_for_package_manager 180; then
                adb -s "$device" shell service check package || true
                echo "::error::Android package manager did not become available after emulator reboot."
                exit 1
              fi
            fi

            run_instrumentation() {
              local log_file="$1"
              local result
              set +e
              ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest 2>&1 | tee "$log_file"
              result=$?
              set -e
              return "$result"
            }

            if run_instrumentation instrumentation-attempt-1.log; then
              exit 0
            fi

            # Retry only this known emulator boot/service failure. Do not retry or mask real
            # application test failures, assertion errors, or Keystore test regressions.
            if ! grep -Fq "Can't find service: package" instrumentation-attempt-1.log; then
              echo "::error::Instrumentation failed for a reason other than missing Android package service; not retrying."
              exit 1
            fi

            echo "::warning::Android package service disappeared during APK installation; rebooting and retrying instrumentation once."
            adb -s "$device" reboot || true
            adb -s "$device" wait-for-device
            if ! wait_for_package_manager 180; then
              adb -s "$device" shell service check package || true
              echo "::error::Android package manager remained unavailable after retry reboot."
              exit 1
            fi
            run_instrumentation instrumentation-attempt-2.log

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Validate release signing secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is missing or empty."
              exit 1
            fi
          done

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > release-keystore.jks
          test -s release-keystore.jks
          chmod 600 release-keystore.jks

      - name: Build signed release AAB and APKs plus debug APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease assembleDebug

      - name: Verify APK package, version, and release signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.vibesync.promptstudio' versionCode='20261023' versionName='1.0.4'"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify -verbose "app/build/outputs/bundle/release/app-release.aab" >/dev/null

      - name: Upload signed release bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vibesync-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload release and debug APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vibesync-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release mapping file
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vibesync-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

